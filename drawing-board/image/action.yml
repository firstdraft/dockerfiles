name: Build Drawing Board image
description: Publish an authorized candidate using the caller's existing GHCR credentials
runs:
  using: composite
  steps:
    - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
    - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
    - uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
      with:
        configFile: ${{ github.action_path }}/.devcontainer.json
        imageName: ghcr.io/firstdraft/drawing-board-workspace
        imageTag: sha-${{ github.sha }}
        platform: linux/amd64,linux/arm64
        push: always
